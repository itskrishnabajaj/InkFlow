name: Build & Deploy Aethelgard

# Builds the Vite app in CI (the cloud) and publishes the static dist/ to the
# gh-pages branch. This deploy-from-branch approach avoids the github-pages
# *environment* branch-protection policy that was rejecting deploys from claude/* .
#
# One-time setup in the repo: Settings → Pages → Build and deployment →
# Source: "Deploy from a branch" → Branch: "gh-pages" / "(root)".

on:
  push:
    branches:
      - main
      - claude/minecraft-game-tablet-yu4ics
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
